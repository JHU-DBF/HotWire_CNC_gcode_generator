name: Build and Release Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r gui_app/requirements.txt
        pip install pyinstaller
    - name: Build Windows executable
      run: |
        cd gui_app
        pyinstaller HotWireCNC.spec
    - name: Upload Windows artifact
      uses: actions/upload-artifact@v4
      with:
        name: HotWireCNC-Windows
        path: gui_app/dist/HotWireCNC.exe

  build-macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r gui_app/requirements.txt
        pip install pyinstaller
    - name: Build macOS executable
      run: |
        cd gui_app
        pyinstaller HotWireCNC.spec
    - name: Upload macOS artifact
      uses: actions/upload-artifact@v4
      with:
        name: HotWireCNC-macOS
        path: gui_app/dist/HotWireCNC

  build-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libxcb-xinerama0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r gui_app/requirements.txt
        pip install pyinstaller
    - name: Build Linux executable
      run: |
        cd gui_app
        pyinstaller HotWireCNC.spec
    - name: Upload Linux artifact
      uses: actions/upload-artifact@v4
      with:
        name: HotWireCNC-Linux
        path: gui_app/dist/HotWireCNC

  release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: ./artifacts
    - name: Create release archives
      run: |
        cd artifacts
        # Create release archives
        zip -r ../HotWireCNC-Windows.zip HotWireCNC-Windows/
        tar -czf ../HotWireCNC-macOS.tar.gz -C HotWireCNC-macOS .
        tar -czf ../HotWireCNC-Linux.tar.gz -C HotWireCNC-Linux .
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          HotWireCNC-Windows.zip
          HotWireCNC-macOS.tar.gz
          HotWireCNC-Linux.tar.gz
        generate_release_notes: true
        token: ${{ secrets.RELEASE_TOKEN }}